name: Test discovery diagnosis

# Why does `dotnet test tests/XerahS.Tests` report "No test is available"?
# Lists tests with adapter diagnostics on the unmodified develop commit.

on:
  push:
    branches: [test-discovery-diagnosis]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: git submodule update --init ShareX.ImageEditor Omacut
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build tests/XerahS.Tests/XerahS.Tests.csproj -c Release -m:1 -p:UseSharedCompilation=false
      - name: Resolved test packages
        shell: pwsh
        run: dotnet list tests/XerahS.Tests/XerahS.Tests.csproj package | Select-String -Pattern 'NUnit|Test.Sdk|Headless|TestPlatform'
      - name: List tests with diagnostics
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet test tests/XerahS.Tests/XerahS.Tests.csproj -c Release --no-build --list-tests --diag:out/diag/log.txt
          Get-ChildItem out/diag -File | ForEach-Object { "==== $($_.Name)"; Get-Content $_ | Select-String -Pattern 'NUnit|adapter|Adapter|discover|Discover|Exception|error|Skipping|not supported|version' | Select-Object -First 80 }
      - name: Adapter files next to the test DLL
        shell: pwsh
        run: Get-ChildItem tests/XerahS.Tests/bin/Release -Recurse -Include '*nunit*','*TestAdapter*','*testhost*' | Select-Object -ExpandProperty FullName
