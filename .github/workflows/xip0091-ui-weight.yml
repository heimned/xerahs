name: XIP0091 UI weight (before vs after)

# Builds the base commit and this branch, then measures a tray-only (SilentRun) start of each,
# interleaving runs so machine drift hits both builds equally. Also runs the unit tests on this
# branch and opens the main window once per run to prove it still shows the editor.

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Commit or branch to compare against
        default: d3f0016e0979a42bb95a7247fe330500d2001c30
      runs:
        description: Runs per build
        default: "5"
  push:
    branches:
      - xip0091-lightweight-tray-ui

permissions:
  contents: read

jobs:
  build-and-test:
    # Same commands as native-recording.yml: full solution build with warnings as errors,
    # then the whole XerahS.Tests suite (AGENTS.md: the solution build must pass).
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: git submodule update --init ShareX.ImageEditor Omacut
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/desktop/XerahS.sln -c Release -m:1 -p:UseSharedCompilation=false
      - run: dotnet test tests/XerahS.Tests/XerahS.Tests.csproj -c Release --no-build --logger "console;verbosity=minimal"

  measure-windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      BASE_REF: ${{ inputs.base_ref || 'd3f0016e0979a42bb95a7247fe330500d2001c30' }}
      RUNS: ${{ inputs.runs || '3' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish this branch (after)
        shell: pwsh
        run: |
          # Same scoped restores and flags as build/windows/package-windows.ps1 (avoids NETSDK1004
          # on the OS-scoped obj folders and ImageEditor.dll multi-TFM locking).
          $flags = '--disable-build-servers', '-p:nodeReuse=false', '-p:UseSharedCompilation=false', '-p:BuildInParallel=false', '/m:1'
          dotnet restore ShareX.ImageEditor/src/ShareX.ImageEditor/ShareX.ImageEditor.csproj -p:OS=Windows_NT @flags; if ($LASTEXITCODE) { exit 1 }
          dotnet restore src/desktop/app/XerahS.UI/XerahS.UI.csproj -p:OS=Windows_NT @flags; if ($LASTEXITCODE) { exit 1 }
          dotnet publish src/desktop/app/XerahS.App -c Release -p:OS=Windows_NT -r win-x64 --self-contained true -p:PublishSingleFile=false -p:SkipBundlePlugins=true -o out/after @flags; if ($LASTEXITCODE) { exit 1 }

      - name: Publish base commit (before)
        shell: pwsh
        run: |
          git worktree add base $env:BASE_REF
          Push-Location base
          git submodule update --init --recursive
          $flags = '--disable-build-servers', '-p:nodeReuse=false', '-p:UseSharedCompilation=false', '-p:BuildInParallel=false', '/m:1'
          dotnet restore ShareX.ImageEditor/src/ShareX.ImageEditor/ShareX.ImageEditor.csproj -p:OS=Windows_NT @flags; if ($LASTEXITCODE) { exit 1 }
          dotnet restore src/desktop/app/XerahS.UI/XerahS.UI.csproj -p:OS=Windows_NT @flags; if ($LASTEXITCODE) { exit 1 }
          dotnet publish src/desktop/app/XerahS.App -c Release -p:OS=Windows_NT -r win-x64 --self-contained true -p:PublishSingleFile=false -p:SkipBundlePlugins=true -o ../out/before @flags; if ($LASTEXITCODE) { exit 1 }
          Pop-Location

      - name: Measure tray-only start, interleaved
        shell: pwsh
        run: |
          $script = 'scripts/perf/Measure-UiWeight.ps1'
          for ($i = 1; $i -le [int]$env:RUNS; $i++) {
            foreach ($label in 'before', 'after') {
              & $script -AppDir "out/$label" -Label $label -Runs 1 -CheckpointsSec 5,30,120 `
                -SeedSilentRun -ShowMainWindowScreenshotDir out/screenshots -Csv out/perf-results.csv
            }
          }

      - name: Print per-run rows and run-1 screenshots
        if: always()
        shell: pwsh
        run: |
          Import-Csv out/perf-results.csv | Select-Object Label, StartupMs, PrivateMB_5s, PrivateMB_30s, PrivateMB_120s, WorkingSetMB_120s, PrivateMB_AfterShow, WorkingSetMB_AfterShow, PrivateMB_AfterShow120s, WorkingSetMB_AfterShow120s | Format-Table -AutoSize | Out-String -Width 300
          Add-Type -AssemblyName System.Drawing
          foreach ($f in Get-ChildItem out/screenshots -Filter '*-run1.png') {
            $src = [System.Drawing.Image]::FromFile($f.FullName)
            $w = 800; $h = [int]($src.Height * $w / $src.Width)
            $bmp = [System.Drawing.Bitmap]::new($src, $w, $h)
            $ms = [IO.MemoryStream]::new()
            $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Jpeg)
            "SCREENSHOT-BEGIN $($f.Name)"
            $b64 = [Convert]::ToBase64String($ms.ToArray())
            for ($i = 0; $i -lt $b64.Length; $i += 4000) { $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i)) }
            "SCREENSHOT-END"
            $bmp.Dispose(); $src.Dispose()
          }

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path out/perf-results.csv)) { "No measurements were recorded." >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          $table = & scripts/perf/Measure-UiWeight.ps1 -Compare -Csv out/perf-results.csv
          $cols = 'Label','Runs','StartupMs','AsyncInitMs','PrivateMB_5s','PrivateMB_30s','PrivateMB_120s','PrivateMB_AfterShow'
          "## XIP0091 tray-only start: medians (Windows, base $env:BASE_REF)" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| $($cols -join ' | ') |" >> $env:GITHUB_STEP_SUMMARY
          "|$((@('---') * $cols.Count) -join '|')|" >> $env:GITHUB_STEP_SUMMARY
          foreach ($r in $table) { "| $(($cols | ForEach-Object { $r.$_ }) -join ' | ') |" >> $env:GITHUB_STEP_SUMMARY }
          "" >> $env:GITHUB_STEP_SUMMARY
          "Raw per-run rows (check the spread before trusting a difference):" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          Import-Csv out/perf-results.csv | Select-Object Label, Run, StartupMs, PrivateMB_5s, PrivateMB_30s, PrivateMB_120s, PrivateMB_AfterShow | Format-Table -AutoSize | Out-String >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item out/logs -ItemType Directory -Force | Out-Null
          foreach ($label in 'before', 'after') {
            $dir = Join-Path ([IO.Path]::GetTempPath()) "xerahs-perf-$label"
            New-Item "out/logs/$label" -ItemType Directory -Force | Out-Null
            if (Test-Path $dir) { Get-ChildItem $dir -Directory -Filter 'logs-*' | ForEach-Object { Copy-Item $_.FullName "out/logs/$label/$($_.Name)" -Recurse -Force } }
          }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xip0091-ui-weight
          path: |
            out/perf-results.csv
            out/screenshots
            out/logs
            out/test-results
