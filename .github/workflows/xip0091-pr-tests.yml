name: XIP0091 PR build and tests

# Temporary: same machine and commands as native-recording.yml, but the whole XerahS.Tests suite.
on:
  push:
    branches: [base-tests]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: git submodule update --init ShareX.ImageEditor Omacut
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/desktop/XerahS.sln -c Release -m:1 -p:UseSharedCompilation=false
      - run: dotnet test tests/XerahS.Tests/XerahS.Tests.csproj -c Release --no-build --logger "console;verbosity=minimal"
